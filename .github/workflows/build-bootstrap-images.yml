name: Build Bootstrap Images

# Builds, scans, and pushes the database-bootstrap container images.
# These images back the bootstrap Jobs (db-grant now, db-load-events later).
# db-migrate is NOT here — it reuses the API image built by deploy-api.yml.
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/build-bootstrap-images.yml'
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Rebuild without layer cache — picks up OS security updates (apt-get upgrade layer is otherwise frozen by the GHA cache)"
        type: boolean
        default: false

concurrency:
  group: build-bootstrap-images
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per directory under bootstrap/ that has a Dockerfile.
        # Add db-load-events here when that image lands (PR 2).
        image: [db-grant]

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC:        true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Log in to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Read shared ACR state ─────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init (shared ACR state)
        working-directory: terraform/shared/acr
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=shared-acr.tfstate"

      - name: Read ACR outputs
        id: acr
        working-directory: terraform/shared/acr
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      # ── Build, scan, push ─────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4

      - name: Acquire ACR access token
        id: acr_token
        run: |
          TOKEN=$(az acr login --name "${{ steps.acr.outputs.acr_name }}" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "acr_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ steps.acr.outputs.acr_login_server }}
          username: "00000000-0000-0000-0000-000000000000"
          password: ${{ steps.acr_token.outputs.acr_token }}

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: bootstrap/${{ matrix.image }}
          file: bootstrap/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.acr.outputs.acr_login_server }}/ticketing-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.acr.outputs.acr_login_server }}/ticketing-${{ matrix.image }}:latest
          cache-from: type=gha,scope=bootstrap-${{ matrix.image }}
          cache-to: type=gha,scope=bootstrap-${{ matrix.image }},mode=max
          # `pull: true` re-resolves the FROM tag to the latest upstream digest;
          # `no-cache` (dispatch input) additionally rebuilds every layer so
          # `apt-get upgrade` actually runs instead of replaying a stale cached
          # layer. Use when Trivy flags an OS package with a fix available.
          pull: true
          no-cache: ${{ inputs.no-cache == true }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.acr.outputs.acr_login_server }}/ticketing-${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image to ACR
        run: |
          docker push "${{ steps.acr.outputs.acr_login_server }}/ticketing-${{ matrix.image }}:${{ github.sha }}"
          docker push "${{ steps.acr.outputs.acr_login_server }}/ticketing-${{ matrix.image }}:latest"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ steps.acr.outputs.acr_login_server }}/ticketing-${{ matrix.image }}:${{ github.sha }}"
