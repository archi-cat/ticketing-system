name: DB Load Events

# Manually triggered. Downloads a JSON blob from the event-data storage
# account and inserts the events into the database via the load-events
# command in the API image.
#
# Prerequisites:
#   - db-grant and db-migrate have run at least once on this environment.
#   - The target blob exists in the storage account (upload it first with
#     `az storage blob upload --auth-mode login` — see the runbook).
#
# The command is idempotent: events whose id already exists are skipped, so
# the workflow is safe to re-run with the same blob.
on:
  workflow_dispatch:
    inputs:
      blob_name:
        description: "Blob filename in the events container (e.g. sample-events.json)"
        type: string
        required: true
      image_tag:
        description: "API image tag to use (default: latest)"
        type: string
        required: false
        default: latest

concurrency:
  group: db-load-events
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  load-events:
    name: Load events into database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Read Terraform outputs ────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init (uksouth-primary state)
        working-directory: terraform/environments/uksouth-primary
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=uksouth-primary.tfstate"

      - name: Read Terraform outputs
        id: tf
        working-directory: terraform/environments/uksouth-primary
        run: |
          set -euo pipefail
          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)"           >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)"     >> "$GITHUB_OUTPUT"
          echo "storage_blob_endpoint=$(terraform output -raw storage_blob_endpoint)" >> "$GITHUB_OUTPUT"
          echo "storage_container=$(terraform output -raw storage_events_container_name)" >> "$GITHUB_OUTPUT"
          echo "migrator_uami_name=$(terraform output -json workload_identity_names | jq -r '."db-migrator"')"     >> "$GITHUB_OUTPUT"
          echo "migrator_client_id=$(terraform output -json workload_identity_client_ids | jq -r '."db-migrator"')" >> "$GITHUB_OUTPUT"

      - name: Terraform init (shared ACR state)
        working-directory: terraform/shared/acr
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=shared-acr.tfstate"

      - name: Read ACR outputs
        id: acr
        working-directory: terraform/shared/acr
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      # ── Cluster credentials ───────────────────────────────────────────────
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.tf.outputs.resource_group_name }}" \
            --name "${{ steps.tf.outputs.aks_cluster_name }}" \
            --overwrite-existing

      - name: Install kubelogin
        run: |
          curl -L -o kubelogin.zip https://github.com/Azure/kubelogin/releases/download/v0.1.5/kubelogin-linux-amd64.zip
          unzip kubelogin.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/

      - name: Convert kubeconfig to Azure CLI auth
        run: kubelogin convert-kubeconfig -l azurecli

      # ── Ensure the db-migrator service account exists ─────────────────────
      # The SA is shared with db-migrate. Whichever bootstrap workflow runs
      # first creates it; subsequent applies are no-ops.
      - name: Ensure db-migrator service account
        env:
          DB_MIGRATOR_CLIENT_ID: ${{ steps.tf.outputs.migrator_client_id }}
        run: |
          set -euo pipefail
          envsubst < k8s/bootstrap/db-migrate/serviceaccount.yaml | kubectl apply -f -

      # ── Apply the Job ─────────────────────────────────────────────────────
      - name: Delete any stale db-load-events Job
        run: kubectl delete job db-load-events -n ticketing --ignore-not-found

      - name: Render and apply the Job
        env:
          ACR_LOGIN_SERVER:            ${{ steps.acr.outputs.acr_login_server }}
          IMAGE_TAG:                   ${{ inputs.image_tag }}
          DB_MIGRATOR_UAMI_NAME:       ${{ steps.tf.outputs.migrator_uami_name }}
          EVENTS_STORAGE_ACCOUNT_URL:  ${{ steps.tf.outputs.storage_blob_endpoint }}
          EVENTS_CONTAINER_NAME:       ${{ steps.tf.outputs.storage_container }}
          EVENTS_BLOB_NAME:            ${{ inputs.blob_name }}
        run: |
          set -euo pipefail
          envsubst < k8s/bootstrap/db-load-events/job.yaml | kubectl apply -f -

      # ── Wait for the Job ──────────────────────────────────────────────────
      - name: Wait for the load-events Job
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 300 ))
          while true; do
            COMPLETE=$(kubectl get job db-load-events -n ticketing \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            FAILED=$(kubectl get job db-load-events -n ticketing \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)

            if [ "$COMPLETE" = "True" ]; then
              echo "Load-events Job completed successfully."
              kubectl logs -n ticketing -l job-name=db-load-events --tail=200
              break
            fi
            if [ "$FAILED" = "True" ]; then
              echo "::error::Load-events Job failed."
              kubectl describe job db-load-events -n ticketing
              echo "=== Pod logs ==="
              kubectl logs -n ticketing -l job-name=db-load-events --tail=200
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for the load-events Job."
              kubectl describe job db-load-events -n ticketing
              kubectl logs -n ticketing -l job-name=db-load-events --tail=200
              exit 1
            fi
            sleep 5
          done
