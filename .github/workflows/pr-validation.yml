name: PR Validation

on:
  pull_request:
    branches: [main]
    # No paths / paths-ignore — this workflow MUST run on every PR.
    # The jobs below are required status checks in the branch ruleset;
    # if the workflow were path-filtered, an excluded PR would never
    # report those checks and would deadlock in "pending" forever.
    # Instead, each job runs always but skips its real work when its
    # paths didn't change (see the `changes` job).

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Detect which areas changed ──────────────────────────────────────────────
  # Computes per-area booleans consumed by the validation jobs below.
  # This is what lets the required checks be conditional without being
  # path-filtered at the workflow level.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      k8s: ${{ steps.filter.outputs.k8s }}
      terraform: ${{ steps.filter.outputs.terraform }}
      precommit: ${{ steps.filter.outputs.precommit }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Filter paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4
        id: filter
        with:
          filters: |
            python:
              - 'app/**'
              - '.github/workflows/pr-validation.yml'
            k8s:
              - 'k8s/**'
              - '.github/workflows/pr-validation.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/pr-validation.yml'
            precommit:
              - 'app/**'
              - 'terraform/**'
              - 'k8s/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/pr-validation.yml'

  # ── Pre-commit hooks ────────────────────────────────────────────────────────
  pre-commit:
    name: Pre-commit hooks
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Skip notice
        if: needs.changes.outputs.precommit != 'true'
        run: echo "No relevant changes — pre-commit skipped."

      - name: Checkout
        if: needs.changes.outputs.precommit == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        if: needs.changes.outputs.precommit == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Set up Terraform
        if: needs.changes.outputs.precommit == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Run pre-commit
        if: needs.changes.outputs.precommit == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  # ── Python services ─────────────────────────────────────────────────────────
  python:
    name: Python — ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, scheduler]
    defaults:
      run:
        working-directory: app/${{ matrix.service }}

    steps:
      - name: Skip notice
        if: needs.changes.outputs.python != 'true'
        working-directory: .
        run: echo "No changes under app/ — Python validation skipped."

      - name: Checkout
        if: needs.changes.outputs.python == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        if: needs.changes.outputs.python == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.5.13"
          enable-cache: true
          cache-dependency-glob: app/${{ matrix.service }}/uv.lock

      - name: Set up Python
        if: needs.changes.outputs.python == 'true'
        run: uv python install 3.13

      - name: Install dependencies
        if: needs.changes.outputs.python == 'true'
        run: uv sync --frozen

      - name: Ruff format check
        if: needs.changes.outputs.python == 'true'
        run: uv run ruff format --check .

      - name: Ruff lint
        if: needs.changes.outputs.python == 'true'
        run: uv run ruff check .

      - name: Mypy
        if: needs.changes.outputs.python == 'true'
        run: uv run mypy src

      - name: Pytest
        if: needs.changes.outputs.python == 'true'
        run: uv run pytest --tb=short

  # ── Kustomize manifests ─────────────────────────────────────────────────────
  kustomize:
    name: Kustomize build
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Skip notice
        if: needs.changes.outputs.k8s != 'true'
        run: echo "No changes under k8s/ — Kustomize build skipped."

      - name: Checkout
        if: needs.changes.outputs.k8s == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up kubectl
        if: needs.changes.outputs.k8s == 'true'
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
        with:
          version: "v1.32.0"

      - name: Build overlays
        if: needs.changes.outputs.k8s == 'true'
        run: |
          set -euo pipefail
          for kustomization in $(find k8s -name kustomization.yaml -printf '%h\n' | sort); do
            echo "==> Building $kustomization"
            kubectl kustomize "$kustomization" > /dev/null
          done

  # ── Terraform — runs against all environment compositions ───────────────────
  terraform:
    name: Terraform fmt + validate
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Skip notice
        if: needs.changes.outputs.terraform != 'true'
        run: echo "No changes under terraform/ — Terraform validation skipped."

      - name: Checkout
        if: needs.changes.outputs.terraform == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Terraform
        if: needs.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform fmt check
        if: needs.changes.outputs.terraform == 'true'
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Validate each environment
        if: needs.changes.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          for env_dir in terraform/environments/*/; do
            echo "==> Validating $env_dir"
            (
              cd "$env_dir"
              terraform init -backend=false -input=false
              terraform validate
            )
          done

      - name: Validate each module
        if: needs.changes.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          for module_dir in terraform/modules/*/ terraform/modules/data/*/; do
            [ -d "$module_dir" ] || continue
            echo "==> Validating $module_dir"
            (
              cd "$module_dir"
              terraform init -backend=false -input=false
              terraform validate
            )
          done

      - name: Validate shared resources
        if: needs.changes.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          for shared_dir in terraform/shared/*/; do
            echo "==> Validating $shared_dir"
            (
              cd "$shared_dir"
              terraform init -backend=false -input=false
              terraform validate
            )
          done

      - name: Trivy IaC scan
        if: needs.changes.outputs.terraform == 'true'
        # .trivyignore at the repo root is read automatically — the six
        # triaged suppressions (5 accepted risks + 1 documented false
        # positive) are honoured. See .trivyignore for the reasons.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
