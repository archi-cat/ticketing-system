name: Event Upload

# Manually triggered. Uploads the repo's data/events/*.json files to the
# event-data storage account from INSIDE the cluster (over the private
# endpoint, via Workload Identity) — the replacement for the operator's
# laptop `az storage blob upload`. See ADR-0032.
#
# Run this BEFORE the DB Load Events workflow on a fresh environment:
#   event-upload  (repo JSON -> blob)  ->  db-load-events  (blob -> database)
#
# Prerequisites:
#   - The infra (storage account + event-uploader identity) is deployed.
#   - The event-uploader service account's federated credential exists
#     (created by the identity module on terraform apply).
#
# Idempotent: blobs are uploaded with overwrite=True, and the downstream
# load is idempotent on the event id — safe to re-run.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "API image tag to use (default: latest)"
        type: string
        required: false
        default: latest

concurrency:
  group: event-upload
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Ensure the in-VNet self-hosted runner is up — the kubectl steps reach the
  # PRIVATE API server, routable only from inside the VNet (ADR-0035).
  ensure-runner:
    uses: ./.github/workflows/_ensure-runner.yml
    secrets: inherit

  upload-events:
    name: Upload event files to Blob Storage
    needs: ensure-runner
    runs-on: [self-hosted, vnet, uksouth]

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC:        true

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Log in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Read Terraform outputs ────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init (uksouth-primary state)
        working-directory: terraform/environments/uksouth-primary
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=uksouth-primary.tfstate"

      - name: Read Terraform outputs
        id: tf
        working-directory: terraform/environments/uksouth-primary
        run: |
          set -euo pipefail
          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)"               >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)"         >> "$GITHUB_OUTPUT"
          echo "storage_blob_endpoint=$(terraform output -raw storage_blob_endpoint)"     >> "$GITHUB_OUTPUT"
          echo "storage_container=$(terraform output -raw storage_events_container_name)" >> "$GITHUB_OUTPUT"
          echo "uploader_client_id=$(terraform output -json workload_identity_client_ids | jq -r '."event-uploader"')" >> "$GITHUB_OUTPUT"

      - name: Terraform init (shared ACR state)
        working-directory: terraform/shared/acr
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=shared-acr.tfstate"

      - name: Read ACR outputs
        id: acr
        working-directory: terraform/shared/acr
        run: |
          echo "acr_name=$(terraform output -raw acr_name)"                 >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      # ── Cluster credentials ───────────────────────────────────────────────
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.tf.outputs.resource_group_name }}" \
            --name "${{ steps.tf.outputs.aks_cluster_name }}" \
            --overwrite-existing

      - name: Install kubelogin
        run: |
          curl -L -o kubelogin.zip https://github.com/Azure/kubelogin/releases/download/v0.1.5/kubelogin-linux-amd64.zip
          unzip kubelogin.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/

      - name: Convert kubeconfig to Azure CLI auth
        run: kubelogin convert-kubeconfig -l azurecli

      # ── Ensure the event-uploader service account exists ──────────────────
      - name: Ensure event-uploader service account
        env:
          EVENT_UPLOADER_CLIENT_ID: ${{ steps.tf.outputs.uploader_client_id }}
        run: |
          set -euo pipefail
          envsubst < k8s/bootstrap/event-upload/serviceaccount.yaml | kubectl apply -f -

      # ── Verify the API image signature (the Job runs the API image) ────────
      - name: Acquire ACR access token
        id: acr_token
        run: |
          TOKEN=$(az acr login --name "${{ steps.acr.outputs.acr_name }}" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "acr_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ steps.acr.outputs.acr_login_server }}
          username: "00000000-0000-0000-0000-000000000000"
          password: ${{ steps.acr_token.outputs.acr_token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Verify API image signature
        run: |
          cosign verify \
            --certificate-identity \
              "${{ github.server_url }}/${{ github.repository }}/.github/workflows/_deploy-common.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.acr.outputs.acr_login_server }}/ticketing-api:${{ inputs.image_tag }}"

      # ── Stage the event files as a ConfigMap ──────────────────────────────
      # The Job mounts this at /events and uploads each *.json. ConfigMaps cap
      # at 1 MiB — fine for the sample set; large event catalogues would need a
      # different delivery (e.g. an init container that pulls from the repo).
      - name: Create event-data ConfigMap from data/events/
        run: |
          set -euo pipefail
          kubectl create configmap event-data \
            --namespace ticketing \
            --from-file=data/events/ \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Apply the Job ─────────────────────────────────────────────────────
      - name: Delete any stale event-upload Job
        run: kubectl delete job event-upload -n ticketing --ignore-not-found

      - name: Render and apply the Job
        env:
          ACR_LOGIN_SERVER:           ${{ steps.acr.outputs.acr_login_server }}
          IMAGE_TAG:                  ${{ inputs.image_tag }}
          EVENTS_STORAGE_ACCOUNT_URL: ${{ steps.tf.outputs.storage_blob_endpoint }}
          EVENTS_CONTAINER_NAME:      ${{ steps.tf.outputs.storage_container }}
        run: |
          set -euo pipefail
          envsubst < k8s/bootstrap/event-upload/job.yaml | kubectl apply -f -

      # ── Wait for the Job ──────────────────────────────────────────────────
      - name: Wait for the event-upload Job
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 300 ))
          while true; do
            COMPLETE=$(kubectl get job event-upload -n ticketing \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            FAILED=$(kubectl get job event-upload -n ticketing \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)

            if [ "$COMPLETE" = "True" ]; then
              echo "Event-upload Job completed successfully."
              kubectl logs -n ticketing -l job-name=event-upload --tail=200
              break
            fi
            if [ "$FAILED" = "True" ]; then
              echo "::error::Event-upload Job failed."
              kubectl describe job event-upload -n ticketing
              echo "=== Pod logs ==="
              kubectl logs -n ticketing -l job-name=event-upload --tail=200
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for the event-upload Job."
              kubectl describe job event-upload -n ticketing
              kubectl logs -n ticketing -l job-name=event-upload --tail=200
              exit 1
            fi
            sleep 5
          done
