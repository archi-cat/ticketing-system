name: Infrastructure — uksouth Environment

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/environments/uksouth-primary/**'
      - 'terraform/modules/**'
      - '.github/workflows/infra-uksouth.yml'
  pull_request:
    paths:
      - 'terraform/environments/uksouth-primary/**'
      - 'terraform/modules/**'
      - '.github/workflows/infra-uksouth.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform — uksouth
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/uksouth-primary

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC:        true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=uksouth-primary.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="name_suffix=${{ secrets.NAME_SUFFIX }}" \
            -var="gh_actions_sp_object_id=${{ secrets.GH_ACTIONS_SP_OBJECT_ID }}" \
            -var="postgres_entra_admin_object_id=${{ secrets.POSTGRES_ENTRA_ADMIN_OBJECT_ID }}" \
            -var="postgres_entra_admin_name=${{ secrets.POSTGRES_ENTRA_ADMIN_NAME }}" \
            -var="duckdns_fqdn=${{ secrets.DUCKDNS_FQDN }}" \
            -var="alert_email_address=${{ secrets.ACME_EMAIL }}" \
            -out=tfplan -no-color | tee plan_output.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/uksouth-primary/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan — uksouth-primary\n```\n' + truncated + '\n```'
            });

      - name: Terraform apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

      # ── Post-apply: DuckDNS API token in Key Vault ──────────────────────────
      # Set inside the workflow because (a) the KV firewall only allows the
      # deployer-detected IP (this runner) at apply time, and (b) we want the
      # token in place by the time ESO's next reconcile fires so the cert
      # pipeline can converge without manual intervention. Idempotent — same
      # value re-applied each run is a no-op for ESO.
      - name: Set DuckDNS token in Key Vault
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          KV_NAME=$(terraform output -raw keyvault_name)
          az keyvault secret set \
            --vault-name "$KV_NAME" \
            --name duckdns-api-token \
            --value "${{ secrets.DUCKDNS_API_TOKEN }}" \
            --output none
          echo "✓ DuckDNS token set in Key Vault $KV_NAME"

      # ── Post-apply: cert-pipeline CRD manifests ─────────────────────────────
      # ClusterSecretStore, ExternalSecret (DuckDNS token sync), ClusterIssuers
      # (staging + production), Certificate, PushSecret. Applied here rather
      # than via Terraform because the alekc/kubectl provider can't defer
      # configuration when module.aks.host is "(known after apply)" — see
      # k8s/cluster-addons/cert-pipeline/README.md.
      - name: Get AKS credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          AKS_NAME=$(terraform output -raw aks_cluster_name)
          RG=$(terraform output -raw resource_group_name)
          az aks get-credentials --resource-group "$RG" --name "$AKS_NAME" --overwrite-existing

      - name: Install kubelogin
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          curl -L -o kubelogin.zip https://github.com/Azure/kubelogin/releases/download/v0.1.5/kubelogin-linux-amd64.zip
          unzip kubelogin.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/

      - name: Convert kubeconfig to Azure CLI auth
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Apply cert-pipeline manifests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ACME_EMAIL:    ${{ secrets.ACME_EMAIL }}
          DUCKDNS_FQDN:  ${{ secrets.DUCKDNS_FQDN }}
        run: |
          set -euo pipefail
          KEYVAULT_URI=$(terraform output -raw keyvault_uri)
          export KEYVAULT_URI
          for f in ../../../k8s/cluster-addons/cert-pipeline/*.yaml; do
            echo "==> $(basename "$f")"
            envsubst < "$f" | kubectl apply -f -
          done

      # ── Post-apply: Gateway ────────────────────────────────────────────────
      # The Gateway needs to be up before we can update DuckDNS — its
      # status.addresses[0].value is the canonical hostname AGC exposes for
      # the bound frontend, and that's the truthful source for the A record.
      # deploy-gateway.yml stays around for ad-hoc Gateway edits between
      # deploys; this step owns the bootstrap path.
      - name: Apply gateway overlay
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          AGC_ID=$(terraform output -raw agc_id)
          AGC_FRONTEND_NAME=$(terraform output -raw agc_frontend_name)
          export AGC_ID AGC_FRONTEND_NAME
          kubectl kustomize ../../../k8s/overlays/uksouth/gateway \
            | envsubst \
            | kubectl apply -f -

      - name: Wait for Gateway to be Programmed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          kubectl wait gateway/ticketing -n ticketing \
            --for=condition=Programmed \
            --timeout=5m

      # ── Post-apply: NetworkPolicies (landing-zone security baseline) ───────
      # Default-deny + per-component allow rules for the ticketing namespace.
      # Applied here so the namespace has its security baseline in place
      # before any application pods schedule. ACNS (security.enabled +
      # observability.enabled) is enabled on the cluster by the Terraform
      # module — required for the toFQDNs rules in 02 and 03 to enforce
      # rather than silently fail-open.
      - name: Apply NetworkPolicies
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for f in ../../../k8s/cluster-addons/network-policies/*.yaml; do
            echo "==> $(basename "$f")"
            kubectl apply -f "$f"
          done

      # ── Post-apply: DuckDNS A record → Gateway's address ────────────────────
      # Reading from the Gateway's status (not from any Terraform output)
      # because the Gateway is the source of truth for where traffic actually
      # lands — regardless of which AGC frontend the ALB Controller ended up
      # binding to. The DuckDNS update endpoint is a SET operation, fully
      # idempotent — re-running with the same IP returns OK with no change.
      - name: Update DuckDNS A record
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DUCKDNS_FQDN:      ${{ secrets.DUCKDNS_FQDN }}
          DUCKDNS_API_TOKEN: ${{ secrets.DUCKDNS_API_TOKEN }}
        run: |
          set -euo pipefail
          GATEWAY_FQDN=$(kubectl get gateway -n ticketing ticketing \
            -o jsonpath='{.status.addresses[0].value}')
          if [ -z "$GATEWAY_FQDN" ]; then
            echo "::error::Gateway has no status.addresses[0].value yet."
            exit 1
          fi
          GATEWAY_IP=$(dig +short "$GATEWAY_FQDN" | head -n 1)
          if [ -z "$GATEWAY_IP" ]; then
            echo "::error::Failed to resolve Gateway address $GATEWAY_FQDN to an IP."
            exit 1
          fi

          # DuckDNS update API: domains is the subdomain only (no .duckdns.org).
          SUBDOMAIN="${DUCKDNS_FQDN%.duckdns.org}"
          RESPONSE=$(curl -sS \
            "https://www.duckdns.org/update?domains=${SUBDOMAIN}&token=${DUCKDNS_API_TOKEN}&ip=${GATEWAY_IP}")

          if [ "$RESPONSE" != "OK" ]; then
            echo "::error::DuckDNS update returned '$RESPONSE' (expected 'OK')."
            exit 1
          fi
          echo "✓ DuckDNS A record for $DUCKDNS_FQDN → $GATEWAY_IP (Gateway address $GATEWAY_FQDN)"
