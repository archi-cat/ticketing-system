name: Shared Infrastructure — ACR

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/shared/acr/**'
      - '.github/workflows/infra-shared.yml'
  pull_request:
    paths:
      - 'terraform/shared/acr/**'
      - '.github/workflows/infra-shared.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write   # needed to comment terraform plan on PRs

jobs:
  terraform:
    name: Terraform — shared ACR
    # Dependabot-triggered runs don't receive repository Actions secrets
    # (GitHub treats them like fork PRs), so azure/login would fail with
    # empty client-id/tenant-id. Action-bump PRs that touch this file
    # would otherwise trigger the plan via the pull_request paths filter.
    # Skipping is safe: the plan can't be affected by an action SHA bump,
    # pr-validation still runs fmt+validate, and the full plan+apply runs
    # on merge to main anyway.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/shared/acr

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC:        true

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=shared-acr.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}" \
            -out=tfplan -no-color | tee plan_output.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/shared/acr/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan — shared ACR\n```\n' + truncated + '\n```'
            });

      - name: Terraform apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan
