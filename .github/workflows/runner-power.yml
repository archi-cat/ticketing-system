name: Runner power (start / deallocate)

# Manual control for the self-hosted runner VM's power state — the session
# switch for the cost model. Start the runner at the beginning of a deploy
# session; deallocate it at the end (the VM, its data, and its GitHub
# registration all survive — you pay disk only). Also the entry point for a
# human who needs the runner up to run kubectl against the private cluster.
# See docs/04-private-cluster-access.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "start = boot the runner; deallocate = stop billing (disk only)"
        type: choice
        options:
          - start
          - deallocate
        required: true
        default: start

permissions:
  id-token: write
  contents: read

jobs:
  power:
    name: ${{ inputs.action }} runner
    runs-on: ubuntu-latest
    env:
      RG_PLATFORM: rg-ticketing-platform
      RUNNER_VM:   vm-ticketing-runner
    steps:
      - name: Log in to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ${{ inputs.action }} the runner VM
        run: |
          set -euo pipefail
          if [ "${{ inputs.action }}" = "start" ]; then
            az vm start --resource-group "$RG_PLATFORM" --name "$RUNNER_VM" --only-show-errors
            echo "✓ runner started"
          else
            az vm deallocate --resource-group "$RG_PLATFORM" --name "$RUNNER_VM" --only-show-errors
            echo "✓ runner deallocated (disk-only billing; data + registration preserved)"
          fi
