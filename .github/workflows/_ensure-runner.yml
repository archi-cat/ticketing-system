name: _ensure-runner

# Reusable pre-job (workflow_call): make sure the self-hosted runner VM is
# started before a self-hosted job runs, so a deallocated (cost-saved) runner
# doesn't leave the job queued forever. Checks the power state first and only
# starts if needed. It deliberately does NOT stop the runner: an auto-stop would
# race with any other job using the runner. Deallocate is a session action via
# runner-power.yml. See ADR-0035 / docs/04-private-cluster-access.md.

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  start-runner:
    name: Ensure runner started
    runs-on: ubuntu-latest
    env:
      RG_PLATFORM: rg-ticketing-platform
      RUNNER_VM:   vm-ticketing-runner
    steps:
      - name: Log in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check runner power state
        id: power
        run: |
          set -euo pipefail
          STATE=$(az vm get-instance-view \
            --resource-group "$RG_PLATFORM" --name "$RUNNER_VM" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" \
            -o tsv)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "runner power state: ${STATE:-unknown}"

      - name: Start the runner VM
        if: steps.power.outputs.state != 'PowerState/running'
        run: |
          set -euo pipefail
          # Returns once the VM is running. The runner's systemd service
          # reconnects to GitHub within ~1 min, after which the dependent
          # self-hosted job is dispatched — GitHub queues it until then, so no
          # explicit online-poll is needed here.
          az vm start --resource-group "$RG_PLATFORM" --name "$RUNNER_VM" --only-show-errors
          echo "✓ runner VM started"

      - name: Runner already running
        if: steps.power.outputs.state == 'PowerState/running'
        run: echo "✓ runner already running — nothing to do"
