name: Teardown — destroy regional + shared infra

# Manual-only workflow that tears the project down for a clean rebuild.
#
# Graceful-first strategy: try `terraform destroy` first (which deletes
# extension resources like diagnostic settings in correct dependency
# order, avoiding the orphan-record quirks that az group delete can
# leave behind), then `az group delete` as a backstop in case anything
# is stuck.
#
# Order:
#   1. terraform destroy (uksouth-primary) — graceful, ~25 min
#   2. az group delete on rg-ticketing-uksouth — backstop, catches
#      anything terraform missed (Helm releases when the cluster API
#      is unreachable, etc.)
#   3. AKS-managed node resource group, if it didn't auto-delete
#   4. Purge soft-deleted Key Vault(s) so the same KV name can be reused
#   5. terraform destroy (shared-acr) — graceful, ~5 min
#   6. az group delete on rg-ticketing-shared — backstop
#   7. Terraform state blobs in the state storage account (optional, last)
#
# Does NOT touch:
#   - The Terraform state resource group (separate, holds the state account)
#   - The Service Principal / OIDC federated credentials (subscription-scope)
#   - Any RG outside the two named above (defensive)
#
# Requires manual confirmation — the `confirm` input must be exactly the
# string `destroy`. Anything else aborts before Azure login happens.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" exactly to confirm. Anything else aborts.'
        required: true
        type: string
      purge_soft_deleted:
        description: "Purge soft-deleted Key Vaults so the same name can be reused immediately"
        required: false
        type: boolean
        default: true
      delete_state_files:
        description: "Delete the Terraform state blobs so the next deploy starts from a clean state"
        required: false
        type: boolean
        default: true

concurrency:
  group: teardown
  cancel-in-progress: false   # never interrupt an in-flight delete

permissions:
  id-token: write
  contents: read

jobs:

  # ── Guard: refuse to proceed without explicit confirmation ────────────────
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation token
        run: |
          set -uo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "::error::Confirmation input was '${{ github.event.inputs.confirm }}', expected 'destroy'. Aborting."
            exit 1
          fi
          echo "✓ Confirmation accepted."

  # ── Teardown: the actual work ─────────────────────────────────────────────
  teardown:
    name: Tear down
    needs: guard
    runs-on: ubuntu-latest

    env:
      RG_REGIONAL:    rg-ticketing-uksouth
      RG_AKS_NODES:   rg-ticketing-uksouth-aks-nodes
      RG_SHARED:      rg-ticketing-shared
      LOCATION:       uksouth

      # OIDC auth for any terraform destroy step that goes through azurerm.
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC:        true

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      # ── Pre-flight: show exactly what's about to disappear ──────────────────
      - name: Show what will be destroyed
        run: |
          set -uo pipefail
          for rg in "$RG_REGIONAL" "$RG_AKS_NODES" "$RG_SHARED"; do
            echo "::group::Resources in $rg"
            if az group show -n "$rg" >/dev/null 2>&1; then
              az resource list -g "$rg" --query "[].{name:name, type:type}" -o table || echo "(RG empty)"
            else
              echo "(RG does not exist)"
            fi
            echo "::endgroup::"
          done

      # ── 1a. Graceful: terraform destroy on the regional state ─────────────
      # terraform destroy walks the dependency graph in reverse and explicitly
      # deletes extension resources (diagnostic settings, role assignments,
      # etc.) before their parents. This is what avoids the orphan-diagnostic-
      # setting issue that az group delete sometimes leaves behind.
      #
      # The Helm releases for cluster add-ons are destroyed first (they
      # depend on the AKS cluster being reachable), then AKS, then the rest.
      # If the helm provider can't reach the cluster API (cluster already
      # half-gone, AAD token issues), the destroy may hang or partially fail
      # — that's what the force-delete backstop in step 1b is for.
      #
      # `continue-on-error: true` + `timeout-minutes: 45` together mean:
      # "give terraform up to 45 minutes to do this gracefully, then move
      # on to the forceful path regardless of outcome."
      - name: Terraform init (uksouth-primary state)
        id: tf_init_regional
        continue-on-error: true
        working-directory: terraform/environments/uksouth-primary
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=uksouth-primary.tfstate"

      - name: Terraform destroy — uksouth-primary (graceful)
        if: steps.tf_init_regional.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        working-directory: terraform/environments/uksouth-primary
        run: |
          terraform destroy -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="name_suffix=${{ secrets.NAME_SUFFIX }}" \
            -var="gh_actions_sp_object_id=${{ secrets.GH_ACTIONS_SP_OBJECT_ID }}" \
            -var="postgres_entra_admin_object_id=${{ secrets.POSTGRES_ENTRA_ADMIN_OBJECT_ID }}" \
            -var="postgres_entra_admin_name=${{ secrets.POSTGRES_ENTRA_ADMIN_NAME }}" \
            -var="duckdns_fqdn=${{ secrets.DUCKDNS_FQDN }}" \
            -var="alert_email_address=${{ secrets.ACME_EMAIL }}" \
            || echo "::warning::terraform destroy did not complete cleanly; the backstop step will handle leftovers"

      # ── 1b. Backstop: force-delete the regional RG ────────────────────────
      # AKS adds 15-25 minutes if terraform destroy didn't already clean it.
      - name: Force-delete regional RG (backstop)
        run: |
          set -uo pipefail
          if az group show -n "$RG_REGIONAL" >/dev/null 2>&1; then
            echo "==> $RG_REGIONAL still exists; force-deleting (expect 15-25 minutes if AKS is still present)..."
            az group delete -n "$RG_REGIONAL" --yes
            echo "==> ✓ $RG_REGIONAL deleted via az group delete"
          else
            echo "==> ✓ $RG_REGIONAL already gone (terraform destroy succeeded)"
          fi

      # ── 2. Verify regional + chase down orphans ───────────────────────────
      - name: Verify regional RG is gone and clean up orphans
        run: |
          set -uo pipefail

          # 2a. The regional RG itself
          if az group show -n "$RG_REGIONAL" >/dev/null 2>&1; then
            echo "::error::$RG_REGIONAL still exists after the delete completed"
            exit 1
          fi
          echo "✓ Confirmed: $RG_REGIONAL is gone"

          # 2b. The AKS-managed node RG. AKS *should* auto-delete it when the
          #     cluster goes, but the operation occasionally leaves it behind
          #     with stranded NICs / disks.
          if az group show -n "$RG_AKS_NODES" >/dev/null 2>&1; then
            echo "==> AKS node RG $RG_AKS_NODES still exists; deleting"
            az group delete -n "$RG_AKS_NODES" --yes
            echo "==> ✓ $RG_AKS_NODES deleted"
          else
            echo "✓ AKS node RG already gone (auto-deleted with the cluster)"
          fi

          # 2c. Any other RG starting with rg-ticketing-uksouth — would catch
          #     unexpected orphan RGs from earlier failed deploys.
          echo "::group::Other RGs matching 'rg-ticketing-uksouth*' (should be none)"
          az group list --query "[?starts_with(name,'rg-ticketing-uksouth')].name" -o table || echo "(none)"
          echo "::endgroup::"

          # 2d. Subscription-wide leftover resources still tagged for this
          #     environment — diagnostic only, doesn't fail the job.
          echo "::group::Subscription-wide resources still named 'ticketing-uksouth*'"
          az resource list --query "[?contains(name,'ticketing-uksouth')].{name:name, type:type, rg:resourceGroup}" -o table || echo "(none)"
          echo "::endgroup::"

      # ── 3. Purge soft-deleted Key Vaults ──────────────────────────────────
      # Without purge protection (deferred per phase_3_plan.md), KVs go to
      # soft-deleted state for 7 days, blocking re-creation with the same
      # name. Purging unblocks the next deploy immediately.
      - name: Purge soft-deleted Key Vaults
        if: ${{ github.event.inputs.purge_soft_deleted == 'true' }}
        run: |
          set -uo pipefail
          vaults=$(az keyvault list-deleted --query "[?contains(name,'kv-ticketing')].name" -o tsv)
          if [ -z "$vaults" ]; then
            echo "No soft-deleted Key Vaults matching kv-ticketing*; nothing to purge"
          else
            for v in $vaults; do
              echo "==> Purging soft-deleted KV: $v"
              az keyvault purge --name "$v" --location "$LOCATION" \
                && echo "==> ✓ Purged $v" \
                || echo "::warning::Failed to purge $v — may already be purged"
            done
          fi

      # ── 4a. Graceful: terraform destroy on the shared state ───────────────
      # The shared RG has fewer extension resources (just the ACR, plus its
      # geo-replication target), so the orphan-record risk is much lower.
      # We still do the graceful pass first for consistency and to keep
      # the shared-acr.tfstate in sync.
      - name: Terraform init (shared-acr state)
        id: tf_init_shared
        continue-on-error: true
        working-directory: terraform/shared/acr
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=shared-acr.tfstate"

      - name: Terraform destroy — shared-acr (graceful)
        if: steps.tf_init_shared.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: terraform/shared/acr
        run: |
          terraform destroy -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="acr_name=${{ secrets.ACR_NAME }}" \
            || echo "::warning::terraform destroy (shared) did not complete cleanly; the backstop step will handle leftovers"

      # ── 4b. Backstop: force-delete the shared RG ──────────────────────────
      - name: Force-delete shared RG (backstop)
        run: |
          set -uo pipefail
          if az group show -n "$RG_SHARED" >/dev/null 2>&1; then
            echo "==> $RG_SHARED still exists; force-deleting..."
            az group delete -n "$RG_SHARED" --yes
            echo "==> ✓ $RG_SHARED deleted via az group delete"
          else
            echo "==> ✓ $RG_SHARED already gone (terraform destroy succeeded)"
          fi

      - name: Verify shared RG is gone
        run: |
          set -uo pipefail
          if az group show -n "$RG_SHARED" >/dev/null 2>&1; then
            echo "::error::$RG_SHARED still exists after the delete completed"
            exit 1
          fi
          echo "✓ Confirmed: $RG_SHARED is gone"

          echo "::group::Other RGs matching 'rg-ticketing-shared*' (should be none)"
          az group list --query "[?starts_with(name,'rg-ticketing-shared')].name" -o table || echo "(none)"
          echo "::endgroup::"

      # ── 5. Clear the Terraform state blobs ────────────────────────────────
      # The state storage account lives in a SEPARATE resource group (the
      # one identified by TF_STATE_RESOURCE_GROUP, untouched by the deletes
      # above). We just clear the two state blobs so the next deploy plans
      # against an empty state rather than against records of resources that
      # no longer exist.
      - name: Delete Terraform state blobs
        if: ${{ github.event.inputs.delete_state_files == 'true' }}
        env:
          STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
          CONTAINER:       ${{ secrets.TF_STATE_CONTAINER }}
        run: |
          set -uo pipefail
          for blob in uksouth-primary.tfstate shared-acr.tfstate; do
            exists=$(az storage blob exists --auth-mode login \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "$blob" \
              --query exists -o tsv)
            if [ "$exists" = "true" ]; then
              echo "==> Deleting state blob: $blob"
              az storage blob delete --auth-mode login \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$CONTAINER" \
                --name "$blob"
              echo "==> ✓ Deleted $blob"
            else
              echo "==> State blob $blob doesn't exist; skipping"
            fi
            # Also clear the lease/lock file if present (avoids leftover locks)
            lock="$blob.tflock"
            lock_exists=$(az storage blob exists --auth-mode login \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "$lock" \
              --query exists -o tsv)
            if [ "$lock_exists" = "true" ]; then
              echo "==> Deleting lock blob: $lock"
              az storage blob delete --auth-mode login \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$CONTAINER" \
                --name "$lock"
            fi
          done

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "::notice::Teardown complete."
          echo "  Regional path:    terraform destroy (graceful) -> az group delete (backstop)"
          echo "  Regional RG:      $RG_REGIONAL — deleted"
          echo "  AKS node RG:      $RG_AKS_NODES — deleted (auto or explicit)"
          echo "  Shared path:      terraform destroy (graceful) -> az group delete (backstop)"
          echo "  Shared RG:        $RG_SHARED — deleted"
          echo "  Soft-deleted KVs: $([ "${{ github.event.inputs.purge_soft_deleted }}" = "true" ] && echo "purged" || echo "left soft-deleted (will recover within 7 days)")"
          echo "  State blobs:      $([ "${{ github.event.inputs.delete_state_files }}" = "true" ] && echo "cleared" || echo "kept — next deploy will reconcile against potentially-stale state")"
