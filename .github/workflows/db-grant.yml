name: DB Grant

# Manually triggered. Before running this, a human must elevate the
# db-grant UAMI to a Postgres Entra admin (see the bootstrap runbook).
# This workflow confirms that elevation, runs the grant Job, and revokes
# the elevation afterwards — whether the Job succeeded or failed.
on:
  workflow_dispatch:

concurrency:
  group: db-grant
  cancel-in-progress: false   # never interrupt a privileged DB operation

permissions:
  id-token: write
  contents: read

jobs:
  grant:
    name: Register Postgres principals
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC:        true
      RESOURCE_GROUP:      rg-ticketing-uksouth

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Read Terraform outputs ────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform init (uksouth-primary state)
        working-directory: terraform/environments/uksouth-primary
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=uksouth-primary.tfstate"

      - name: Read Terraform outputs
        id: tf
        working-directory: terraform/environments/uksouth-primary
        run: |
          set -euo pipefail

          echo "aks_cluster_name=$(terraform output -raw aks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "postgres_fqdn=$(terraform output -raw postgres_fqdn)" >> "$GITHUB_OUTPUT"
          echo "postgres_database_name=$(terraform output -raw postgres_database_name)" >> "$GITHUB_OUTPUT"

          # UAMI names — from the workload_identity_names output
          NAMES=$(terraform output -json workload_identity_names)
          {
            echo "api_uami_name=$(echo "$NAMES"        | jq -r '.api')"
            echo "worker_uami_name=$(echo "$NAMES"     | jq -r '.worker')"
            echo "scheduler_uami_name=$(echo "$NAMES"  | jq -r '.scheduler')"
            echo "migrator_uami_name=$(echo "$NAMES"   | jq -r '."db-migrator"')"
            echo "grant_uami_name=$(echo "$NAMES"      | jq -r '."db-grant"')"
          } >> "$GITHUB_OUTPUT"

          # db-grant UAMI principal (object) ID — needed to identify it as
          # an AD admin for the pre-flight check and the revoke.
          PRINCIPALS=$(terraform output -json workload_identity_principal_ids)
          echo "grant_principal_id=$(echo "$PRINCIPALS" | jq -r '."db-grant"')" >> "$GITHUB_OUTPUT"

          # db-grant SA client ID — for the ServiceAccount annotation
          CLIENTS=$(terraform output -json workload_identity_client_ids)
          echo "grant_client_id=$(echo "$CLIENTS" | jq -r '."db-grant"')" >> "$GITHUB_OUTPUT"

      # ── Read shared ACR state (for the image location) ────────────────────
      - name: Terraform init (shared ACR state)
        working-directory: terraform/shared/acr
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=shared-acr.tfstate"

      - name: Read ACR outputs
        id: acr
        working-directory: terraform/shared/acr
        run: |
          echo "acr_name=$(terraform output -raw acr_name)"             >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      # ── Pre-flight: confirm db-grant IS elevated ──────────────────────────
      # The human must have elevated db-grant to a Postgres Entra admin
      # before triggering this workflow. If they haven't, fail NOW with a
      # clear message rather than letting the Job fail with an opaque
      # authentication error.
      - name: Pre-flight — verify db-grant is a Postgres Entra admin
        run: |
          set -euo pipefail
          PG_SERVER=$(echo "${{ steps.tf.outputs.postgres_fqdn }}" | cut -d. -f1)

          ADMINS=$(az postgres flexible-server microsoft-entra-admin list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server-name "$PG_SERVER" \
            --query "[].objectId" -o tsv)

          if ! echo "$ADMINS" | grep -qi "${{ steps.tf.outputs.grant_principal_id }}"; then
            echo "::error::db-grant is NOT a Postgres Entra admin on $PG_SERVER."
            echo "A human must elevate it before running this workflow. See the"
            echo "bootstrap runbook — the 'elevate db-grant' step. Aborting."
            exit 1
          fi
          echo "Confirmed: db-grant is elevated. Proceeding."

      # ── Cluster credentials ───────────────────────────────────────────────
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.tf.outputs.resource_group_name }}" \
            --name "${{ steps.tf.outputs.aks_cluster_name }}" \
            --overwrite-existing

      - name: Install kubelogin
        run: |
          curl -L -o kubelogin.zip https://github.com/Azure/kubelogin/releases/download/v0.1.5/kubelogin-linux-amd64.zip
          unzip kubelogin.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/

      - name: Convert kubeconfig to Azure CLI auth
        run: kubelogin convert-kubeconfig -l azurecli

      # ── Log in to ACR (needed for Cosign to pull the image manifest) ────────
      - name: Acquire ACR access token
        id: acr_token
        run: |
          TOKEN=$(az acr login --name "${{ steps.acr.outputs.acr_name }}" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "acr_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ steps.acr.outputs.acr_login_server }}
          username: "00000000-0000-0000-0000-000000000000"
          password: ${{ steps.acr_token.outputs.acr_token }}

      # ── Verify bootstrap image signature ─────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Verify db-grant image signature
        run: |
          cosign verify \
            --certificate-identity \
              "${{ github.server_url }}/${{ github.repository }}/.github/workflows/build-bootstrap-images.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.acr.outputs.acr_login_server }}/ticketing-db-grant:latest"

      # ── Apply the ServiceAccount and Job ──────────────────────────────────
      - name: Delete any stale db-grant Job
        run: |
          # A Job is largely immutable; a leftover from a prior run (inside
          # its TTL window) would block re-apply. Idempotent.
          kubectl delete job db-grant -n ticketing --ignore-not-found

      - name: Render and apply manifests
        env:
          DB_GRANT_CLIENT_ID:    ${{ steps.tf.outputs.grant_client_id }}
          ACR_LOGIN_SERVER:      ${{ steps.acr.outputs.acr_login_server }}
          IMAGE_TAG:             latest
          POSTGRES_FQDN:         ${{ steps.tf.outputs.postgres_fqdn }}
          POSTGRES_DATABASE_NAME: ${{ steps.tf.outputs.postgres_database_name }}
          DB_GRANT_UAMI_NAME:    ${{ steps.tf.outputs.grant_uami_name }}
          API_UAMI_NAME:         ${{ steps.tf.outputs.api_uami_name }}
          WORKER_UAMI_NAME:      ${{ steps.tf.outputs.worker_uami_name }}
          SCHEDULER_UAMI_NAME:   ${{ steps.tf.outputs.scheduler_uami_name }}
          DB_MIGRATOR_UAMI_NAME: ${{ steps.tf.outputs.migrator_uami_name }}
        run: |
          set -euo pipefail
          envsubst < k8s/bootstrap/db-grant/serviceaccount.yaml | kubectl apply -f -
          envsubst < k8s/bootstrap/db-grant/job.yaml            | kubectl apply -f -

      # ── Wait for the Job ──────────────────────────────────────────────────
      - name: Wait for the grant Job
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 300 ))
          while true; do
            COMPLETE=$(kubectl get job db-grant -n ticketing \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            FAILED=$(kubectl get job db-grant -n ticketing \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)

            if [ "$COMPLETE" = "True" ]; then
              echo "Grant Job completed successfully."
              kubectl logs -n ticketing -l job-name=db-grant --tail=200
              break
            fi
            if [ "$FAILED" = "True" ]; then
              echo "::error::Grant Job failed."
              kubectl describe job db-grant -n ticketing
              echo "=== Pod logs ==="
              kubectl logs -n ticketing -l job-name=db-grant --tail=200
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for the grant Job."
              kubectl describe job db-grant -n ticketing
              kubectl logs -n ticketing -l job-name=db-grant --tail=200
              exit 1
            fi
            sleep 5
          done

      # ── Revoke db-grant's elevation — ALWAYS ──────────────────────────────
      # Runs whether the Job succeeded, failed, or timed out. This is what
      # makes the privilege window time-boxed by the workflow rather than
      # by human memory. Tolerates "already absent" — a revoke that finds
      # nothing has still achieved the desired end state.
      - name: Revoke db-grant elevation
        if: always()
        run: |
          set -uo pipefail
          PG_SERVER=$(echo "${{ steps.tf.outputs.postgres_fqdn }}" | cut -d. -f1)

          az postgres flexible-server microsoft-entra-admin delete \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server-name "$PG_SERVER" \
            --object-id "${{ steps.tf.outputs.grant_principal_id }}" \
            --yes \
            && echo "db-grant elevation revoked." \
            || echo "microsoft-entra-admin delete returned non-zero — db-grant is not an admin, which is the desired end state."
