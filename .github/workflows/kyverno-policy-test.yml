name: Kyverno Policy Test

# Proves the image-signature ClusterPolicy actually rejects unsigned images, in
# a throwaway kind cluster. The shipped policy is Audit (observe only); here it
# is flipped to Enforce so a failed verification is denied — and therefore
# assertable. See ADR-0031 and k8s/cluster-addons/kyverno-policies/README.md.
on:
  pull_request:
    paths:
      - 'k8s/cluster-addons/kyverno-policies/**'
      - 'terraform/modules/cluster-addons/kyverno/**'
      - '.github/workflows/kyverno-policy-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-rejects-unsigned:
    name: Unsigned ticketing image is rejected (kind + Kyverno, Enforce)
    runs-on: ubuntu-latest
    env:
      # Keep in sync with terraform/modules/cluster-addons/kyverno/variables.tf
      KYVERNO_CHART_VERSION: "3.8.1"
      CLUSTER_NAME: kyverno-test
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          cluster_name: kyverno-test

      - name: Install Kyverno
        run: |
          set -euo pipefail
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno \
            --version "$KYVERNO_CHART_VERSION" \
            --namespace kyverno --create-namespace \
            --set admissionController.replicas=1 \
            --set backgroundController.replicas=1 \
            --set cleanupController.replicas=1 \
            --set reportsController.replicas=1 \
            --wait --timeout 5m

      - name: Apply the real policy, flipped to Enforce
        env:
          SIGNER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # Ship-as-Audit, test-as-Enforce: flip the action so an unverified
          # image is actually denied. Everything else is the shipped policy.
          for f in k8s/cluster-addons/kyverno-policies/*.yaml; do
            sed 's/failureAction: Audit/failureAction: Enforce/' "$f" \
              | envsubst '${SIGNER_REPO_URL}' \
              | kubectl apply -f -
          done
          # Best-effort sync; the admission webhook picks the policy up within
          # seconds of apply regardless of the exact status condition name.
          kubectl wait --for=condition=Ready --timeout=90s \
            clusterpolicy/verify-image-signatures || true
          sleep 10

      - name: Unsigned ticketing image must be DENIED
        run: |
          set -euo pipefail
          # No such signature exists for this image, so verification fails and
          # admission (Enforce) rejects the Pod — before any pull is attempted.
          cat > /tmp/unsigned-pod.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: unsigned-ticketing-api
            namespace: default
          spec:
            restartPolicy: Never
            containers:
              - name: app
                image: example.com/ticketing-api:unsigned
          EOF
          if kubectl apply -f /tmp/unsigned-pod.yaml 2> /tmp/deny.txt; then
            echo "::error::Unsigned ticketing-api Pod was ADMITTED — enforcement is broken."
            kubectl delete -f /tmp/unsigned-pod.yaml --ignore-not-found
            exit 1
          fi
          echo "✓ Admission denied, as expected:"
          cat /tmp/deny.txt
          grep -qiE 'verify-image-signatures|signature|failed|not allowed' /tmp/deny.txt

      - name: A non-ticketing image must be ADMITTED (scope check)
        run: |
          set -euo pipefail
          # busybox does not match */ticketing-* so no rule applies — it must be
          # admitted, proving the policy is scoped to our images only.
          cat > /tmp/allowed-pod.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: unrelated-busybox
            namespace: default
          spec:
            restartPolicy: Never
            containers:
              - name: app
                image: busybox:1.36
                command: ["true"]
          EOF
          kubectl apply -f /tmp/allowed-pod.yaml
          echo "✓ Non-ticketing image admitted — policy is correctly scoped."
          kubectl delete -f /tmp/allowed-pod.yaml --ignore-not-found
