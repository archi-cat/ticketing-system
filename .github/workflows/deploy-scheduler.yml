name: Deploy Scheduler

on:
  push:
    branches: [main]
    paths:
      - 'app/scheduler/**'
      - 'k8s/base/scheduler/**'
      - 'k8s/base/shared/**'
      - 'k8s/overlays/uksouth/scheduler/**'
      - 'k8s/overlays/uksouth/shared/**'
      - '.github/workflows/deploy-scheduler.yml'
      - '.github/workflows/_deploy-common.yml'
  workflow_dispatch:
    inputs:
      no-cache:
        description: "Rebuild image without layer cache — picks up OS security updates"
        type: boolean
        default: false

concurrency:
  group: deploy-scheduler
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-common.yml
    with:
      unit: scheduler
      image_tag: ${{ github.sha }}
      no_cache: ${{ inputs.no-cache == true }}
    secrets:
      AZURE_CLIENT_ID:          ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID:          ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID:    ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP:  ${{ secrets.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER:       ${{ secrets.TF_STATE_CONTAINER }}
