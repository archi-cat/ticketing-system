apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: ticketing
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: ticketing-system
spec:
  type: ClusterIP
  clusterIP: None              # headless — the worker has no incoming traffic
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: health
      port: 8001
      targetPort: health
      protocol: TCP
