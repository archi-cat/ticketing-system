apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: ticketing
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: ticketing-system
spec:
  replicas: 2                  # two replicas for HA; leader election ensures one does work
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/part-of: ticketing-system
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: scheduler-service-account
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8002
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: ticketing-scheduler
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Redis password gets fetched from Key Vault at deploy time
            # and injected as a Kubernetes Secret. Mounted as REDIS_PASSWORD.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-redis-credentials
                  key: redis-password
          envFrom:
            - configMapRef:
                name: ticketing-base-config
            - configMapRef:
                name: ticketing-region-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30