apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketing

resources:
  - ../../../base/gateway
  - ../shared

patches:
  - path: patches/gateway.yaml
    target:
      kind: Gateway
      name: ticketing

labels:
  - includeSelectors: false
    pairs:
      deployment.region: uksouth
