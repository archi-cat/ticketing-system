apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketing

resources:
  - ../../../base/api
  - ../shared

patches:
  - path: patches/api-deployment.yaml
    target:
      kind: Deployment
      name: api
  - path: patches/api-serviceaccount.yaml
    target:
      kind: ServiceAccount
      name: api-service-account

labels:
  - includeSelectors: false
    pairs:
      deployment.region: uksouth
