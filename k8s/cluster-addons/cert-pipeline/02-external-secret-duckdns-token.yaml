# Sync the DuckDNS API token from Key Vault into a K8s Secret in the
# cert-manager namespace. The cobexer webhook (Helm release) is configured
# to read from this Secret via `duckdns.secret.existingSecretName`, and the
# ClusterIssuers below reference it through `apiTokenSecretRef`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: duckdns-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: keyvault
  target:
    name: duckdns-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        # Key Vault secret name — set by the infra-uksouth workflow's
        # post-apply step from the DUCKDNS_API_TOKEN repo secret.
        key: duckdns-api-token
