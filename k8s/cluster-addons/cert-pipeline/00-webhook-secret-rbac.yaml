# Grants the cobexer DuckDNS webhook permission to read the K8s Secret that
# ESO populates with the DuckDNS API token. The chart's bundled RBAC only
# covers the inline-token path (`duckdns.token=<value>`); when configured
# with `duckdns.secret.existingSecret=true`, it assumes the operator grants
# read access to the referenced Secret manually.
#
# Without this, the Challenge stage fails with:
#   Error presenting challenge: get credential error: failed to load secret
#   "cert-manager/duckdns-api-token": secrets "duckdns-api-token" is
#   forbidden: User "system:serviceaccount:cert-manager:
#   cert-manager-webhook-duckdns" cannot get resource "secrets" ...
#
# Scoped tightly: this Role grants get/list/watch on the single named Secret,
# nothing broader.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: duckdns-webhook-token-reader
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["duckdns-api-token"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: duckdns-webhook-token-reader
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-duckdns
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: duckdns-webhook-token-reader
