# ESO ClusterSecretStore — handle for any namespace to read from / write to
# the regional Key Vault. Auth: ESO's Workload Identity (configured in the
# external-secrets Helm release via Terraform).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${KEYVAULT_URI}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
