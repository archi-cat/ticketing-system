# Let's Encrypt production ClusterIssuer. Subject to Let's Encrypt's
# production rate limits (50 certs / registered domain / week, 5 duplicates
# / week). Switch a Certificate to this only after staging issuance is
# verified.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.duckdns.org
            solverName: duckdns
            config:
              apiTokenSecretRef:
                name: duckdns-api-token
                key: token
