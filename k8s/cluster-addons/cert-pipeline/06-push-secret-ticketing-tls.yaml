# Mirror the issued K8s TLS Secret into Key Vault so AGC can read it (PR 3).
# The split-key form (tls.crt and tls.key as separate KV secrets) is the
# most flexible starting point — PR 3 may switch to a combined PEM bundle
# or a KV Certificate object depending on what AGC's FrontendTLSPolicy
# consumes most cleanly.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ticketing-tls-push
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: keyvault
  selector:
    secret:
      name: ticketing-tls
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: ticketing-tls-crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: ticketing-tls-key
