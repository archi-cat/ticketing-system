# The three app services (api, worker, scheduler) auto-send OpenTelemetry
# traces to Application Insights when APPLICATIONINSIGHTS_CONNECTION_STRING
# is set (see each service's observability.py — uses
# `azure.monitor.opentelemetry.configure_azure_monitor`).
#
# Telemetry ingestion is at `<region>-N.in.applicationinsights.azure.com`
# where N varies per AI instance — the wildcard covers both API + workers
# instances. Live metrics endpoint is NOT needed (disabled in code with
# `enable_live_metrics=False`).
#
# Bootstrap jobs (db-grant, db-migrate, db-load-events) are excluded —
# they're short-lived ops scripts, not instrumented.
#
# ACNS DNS-proxy behaviour:
#   ACNS rejects `rules.dns.matchPattern: "*"` (the universal wildcard) via
#   its validating admission policy, but accepts *explicit* patterns. The
#   ACNS DNS proxy only populates the FQDN cache for patterns it's been
#   told to inspect — earlier attempts at FQDN-only policies failed because
#   no DNS L7 hint was given. The two rules below MUST stay in the same
#   policy: the proxy uses the DNS rule's matchPattern to know which
#   responses to inspect, then the toFQDNs rule references the IPs that
#   came out of that inspection.
#
# 01-dns-egress.yaml's L4 DNS allow remains in play for resolving
# non-FQDN-tracked names (cluster services, etc.). This policy adds the
# L7 DNS inspection hint on top, scoped to the App Insights pattern only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-app-insights-egress
  namespace: ticketing
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - api
          - worker
          - scheduler
  egress:
    # 1. DNS query to kube-dns, with the L7 pattern hint that tells the
    #    ACNS DNS proxy to inspect these specific queries and cache the
    #    resolved IPs against the toFQDNs rule below.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.in.applicationinsights.azure.com"
    # 2. HTTPS to whichever IPs the DNS proxy resolved and cached above.
    - toFQDNs:
        - matchPattern: "*.in.applicationinsights.azure.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
