# Bootstrap pods (db-grant, db-migrate, db-load-events) need to reach Azure AD
# during their auth flow. The Azure CLI / azidentity SDK touches multiple
# endpoints during `az login --service-principal --federated-token`: AAD core
# (login.microsoftonline.com), regional AAD edges, management.azure.com, and
# others that DNS resolves to IPs which:
#   1. Are not all in the AzureActiveDirectory service tag
#   2. Vary by the resolver's geographic location
#   3. Aren't tracked by ACNS's DNS proxy on this cluster (FQDN cache stays
#      empty even with both `toFQDNs` and a same-policy DNS allow — likely
#      an ACNS gap rather than a misconfiguration on our side)
#
# Until ACNS FQDN tracking works reliably, bootstrap pods get a `world`
# egress allow on port 443. The trade-off:
#   - Bootstrap pods are short-lived, run-to-completion Jobs, manually
#     triggered. The blast radius of a broader egress allow is small.
#   - The label scope (app.kubernetes.io/component: db-bootstrap) keeps this
#     allow off the application pods (api/worker/scheduler), which continue
#     to use 02-azure-ad-egress.yaml's narrower FQDN+CIDR shape.
#
# When ACNS FQDN tracking is fixed (Microsoft support case or AKS version
# bump), narrow this back to specific FQDNs / CIDRs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bootstrap-aad-egress-workaround
  namespace: ticketing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: db-bootstrap
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
