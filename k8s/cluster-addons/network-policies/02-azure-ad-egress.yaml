# Workload Identity needs to reach Azure AD to exchange the federated token
# for an Azure access token. Applies to every pod in `ticketing` — apps and
# bootstrap jobs alike depend on this for their respective Azure SDKs
# (asyncpg → Postgres, redis-py → Redis, azure-servicebus, azure-storage-blob,
# `az login` in db-grant).
#
# Requires ACNS `security.advancedNetworkPolicies = "FQDN"` on the cluster
# (set in the AKS Terraform module) — that deploys the DNS proxy which
# inspects queries matching the `rules.dns` patterns below and populates
# the FQDN cache the `toFQDNs` rule matches against. The two rules MUST
# stay in the same policy. `security.enabled` alone is not sufficient —
# see the README's "Required cluster feature: ACNS" section.
#
# Queries that don't match the patterns below aren't blocked — they pass
# through 01-dns-egress.yaml's plain L4 allow uninspected (only matching
# lookups appear in `cilium fqdn cache list`; everything else keeps
# resolving normally).
#
# Pattern provenance (discovered via `cilium monitor --type drop` +
# `cilium fqdn cache list` on the node running the pod — don't trim
# without re-testing the db-grant Job):
#   *.microsoftonline.com  — AAD token endpoints (all SDKs + az login)
#   *.windows.net          — sts.windows.net et al; ALSO covers
#                            azcliprod.blob.core.windows.net, which the
#                            az CLI contacts on startup (version check).
#                            This was the mystery 57.150.61.65 drop.
#   *.microsoft.com        — az CLI auxiliary endpoints
#   *.msauth.net           — AAD auth CDN
#   *.msftauth.net         — AAD auth CDN
#   management.azure.com   — ARM; az login touches it even when the
#                            workload only needs a token. This was the
#                            mystery 4.150.240.10 drop that kept db-grant
#                            hanging at "Acquiring PostgreSQL Entra
#                            access token".
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-azure-ad-egress
  namespace: ticketing
spec:
  endpointSelector: {}
  egress:
    # 1. DNS to kube-dns with the L7 pattern hints that tell the ACNS DNS
    #    proxy which lookups to inspect and cache for the toFQDNs rule below.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*.microsoftonline.com"
              - matchPattern: "*.windows.net"
              - matchPattern: "*.microsoft.com"
              - matchPattern: "*.msauth.net"
              - matchPattern: "*.msftauth.net"
              - matchPattern: "management.azure.com"
    # 2. HTTPS to the IPs the DNS proxy resolved and cached above.
    - toFQDNs:
        - matchPattern: "*.microsoftonline.com"
        - matchPattern: "*.windows.net"
        - matchPattern: "*.microsoft.com"
        - matchPattern: "*.msauth.net"
        - matchPattern: "*.msftauth.net"
        - matchPattern: "management.azure.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
