# Workload Identity needs to reach Azure AD to exchange the federated token
# for an Azure access token. Applies to every pod in `ticketing` — apps and
# bootstrap jobs alike depend on this for their respective Azure SDKs
# (asyncpg → Postgres, redis-py → Redis, azure-servicebus, azure-storage-blob,
# `az login` in db-grant).
#
# Cilium FQDN policy with toFQDNs — requires ACNS `security.enabled` on the
# AKS cluster (set in the AKS Terraform module).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-azure-ad-egress
  namespace: ticketing
spec:
  endpointSelector: {}
  egress:
    # Primary path: FQDN-based egress.
    # ACNS is supposed to populate the IPs behind these FQDNs transparently
    # via its own DNS proxy (the user-defined `rules.dns` block we tried in
    # 01-dns-egress.yaml is blocked by the platform's validating admission
    # policy because it would conflict). In practice, the FQDN cache stays
    # empty for db-grant traffic in this cluster — possibly an ACNS bug or
    # configuration gap. Kept here so traffic uses this rule once FQDN
    # tracking starts working.
    - toFQDNs:
        - matchPattern: "*.microsoftonline.com"
        - matchPattern: "*.windows.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Fallback: CIDR-based egress using Microsoft's published
    # AzureActiveDirectory service-tag IP ranges. Cilium evaluates egress
    # rules as a union, so this allows traffic when toFQDNs doesn't track
    # the IP. Trade-off accepted: less precise (covers any Azure-AD-backed
    # service on these ranges, not just login.microsoftonline.com) and
    # brittle (Microsoft rotates these ranges slowly but does rotate).
    # Sourced from the AzureActiveDirectory service tag — the canonical list
    # is at https://www.microsoft.com/en-us/download/details.aspx?id=56519
    # (refreshed weekly).
    - toCIDR:
        - 20.190.128.0/18 # AzureActiveDirectory primary
        - 40.126.0.0/18   # AzureActiveDirectory secondary
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
