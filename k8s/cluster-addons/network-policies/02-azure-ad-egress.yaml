# Workload Identity needs to reach Azure AD to exchange the federated token
# for an Azure access token. Applies to every pod in `ticketing` — apps and
# bootstrap jobs alike depend on this for their respective Azure SDKs
# (asyncpg → Postgres, redis-py → Redis, azure-servicebus, azure-storage-blob,
# `az login` in db-grant).
#
# Cilium FQDN policy with toFQDNs — requires ACNS `security.enabled` on the
# AKS cluster (set in the AKS Terraform module).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-azure-ad-egress
  namespace: ticketing
spec:
  endpointSelector: {}
  egress:
    - toFQDNs:
        # Azure's own ACNS FQDN-filtering docs consistently use matchPattern
        # rather than matchName — pattern entries are populated more reliably
        # by the platform's DNS proxy. Wildcard covers login.microsoftonline.com
        # (primary v2 endpoint) and any regional variants.
        - matchPattern: "*.microsoftonline.com"
        # Legacy v1 AAD endpoints the Azure SDK / az CLI sometimes fall back
        # to during discovery (login.windows.net, sts.windows.net).
        - matchPattern: "*.windows.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
