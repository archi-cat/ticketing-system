# Every pod in `ticketing` needs DNS — to resolve service FQDNs (Postgres,
# Redis, Service Bus), Azure AD, App Insights, etc. CoreDNS runs in
# kube-system as the `kube-dns` service on UDP/TCP 53.
#
# L4-only allow: port 53 reachability to kube-dns. NO `rules.dns` L7
# inspection block — ACNS (`security.enabled = true` on the AKS cluster)
# runs its own DNS proxy at the dataplane level to populate the IPs
# behind subsequent `toFQDNs` rules, and explicitly blocks user-defined
# L7 DNS rules via a ValidatingAdmissionPolicy
# (advanced-networking-validating-policy). Two competing DNS proxies on
# the same flow would race; ACNS wins. We just need to let traffic to
# kube-dns through.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ticketing
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
