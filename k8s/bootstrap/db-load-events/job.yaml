apiVersion: batch/v1
kind: Job
metadata:
  name: db-load-events
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-system
    app.kubernetes.io/component: db-bootstrap
spec:
  # load-events is idempotent (ON CONFLICT DO NOTHING), so one retry on a
  # transient connection error is safe.
  backoffLimit: 1

  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ticketing-system
        app.kubernetes.io/component: db-bootstrap
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: db-migrator-service-account
      restartPolicy: Never

      containers:
        - name: db-load-events
          image: ${ACR_LOGIN_SERVER}/ticketing-api:${IMAGE_TAG}

          # Override the image's uvicorn CMD with the load-events script.
          # The script is registered as a console_scripts entry point and is
          # on PATH inside the venv.
          command: ["load-events"]

          envFrom:
            - configMapRef:
                name: ticketing-base-config
            - configMapRef:
                name: ticketing-region-config

          env:
            # Use the db-migrator identity to connect to Postgres — it has
            # DDL + DML rights on the ticketing database.
            - name: POSTGRES_USER
              value: ${DB_MIGRATOR_UAMI_NAME}

            # Storage account and container resolved from Terraform outputs.
            - name: EVENTS_STORAGE_ACCOUNT_URL
              value: ${EVENTS_STORAGE_ACCOUNT_URL}
            - name: EVENTS_CONTAINER_NAME
              value: ${EVENTS_CONTAINER_NAME}

            # Blob filename supplied by the workflow caller — allows loading
            # different event sets without changing the manifest.
            - name: EVENTS_BLOB_NAME
              value: ${EVENTS_BLOB_NAME}

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: tmp
          emptyDir: {}

      securityContext:
        seccompProfile:
          type: RuntimeDefault
