apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrator-service-account
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-system
    app.kubernetes.io/component: db-bootstrap
  annotations:
    # Links this ServiceAccount to the db-migrator UAMI. The value is the
    # UAMI's CLIENT ID — injected at apply time from the Terraform output
    # module.identity.identity_client_ids["db-migrator"].
    azure.workload.identity/client-id: ${DB_MIGRATOR_CLIENT_ID}
