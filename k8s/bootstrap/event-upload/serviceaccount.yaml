apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-uploader-service-account
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-system
    app.kubernetes.io/component: db-bootstrap
  annotations:
    # Links this ServiceAccount to the event-uploader UAMI. The value is the
    # UAMI's CLIENT ID — injected at apply time from the Terraform output
    # module.identity.identity_client_ids["event-uploader"].
    azure.workload.identity/client-id: ${EVENT_UPLOADER_CLIENT_ID}
