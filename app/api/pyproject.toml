[project]
name = "ticketing-api"
version = "0.1.0"
description = "Ticketing system — API service"
requires-python = ">=3.13,<3.14"

dependencies = [
    # Web framework
    # starlette floored at 1.3.1 for CVE-2026-48818 + CVE-2026-54283; fastapi
    # 0.138.0 is the first release whose starlette pin (>=0.46.0, uncapped)
    # admits the 1.x line — 0.137.0 capped it below 1.0.
    "fastapi==0.139.0",
    "starlette>=1.3.1",
    "uvicorn[standard]==0.51.0",
    # Settings and validation
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.2",
    # Database — PostgreSQL via SQLAlchemy 2 async
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    # Azure SDKs (passwordless auth via Workload Identity)
    "azure-identity==1.25.3",
    "azure-keyvault-secrets==4.11.0",
    "azure-servicebus==7.14.3",
    "aiohttp==3.14.1",
    "urllib3>=2.7.0",
    # Security floors for transitive deps (via azure-identity/msal) — CVE fixes:
    #   cryptography >= 48.0.1  GHSA-537c-gmf6-5ccf
    #   PyJWT        >= 2.13.0  CVE-2026-48526
    "cryptography>=48.0.1",
    "PyJWT>=2.13.0",
    # Redis
    "redis[hiredis]==8.0.1",
    # Observability
    # azure-monitor-opentelemetry bundles AND auto-activates fastapi
    # instrumentation, so it is NOT pinned here — it arrives transitively at
    # the matching core version. sqlalchemy + redis instrumentation are
    # neither bundled nor auto-activated by configure_azure_monitor (they're
    # not in its supported-libraries list), so they stay as explicit pins and
    # are activated explicitly in observability.py via SQLAlchemyInstrumentor /
    # RedisInstrumentor. All OTel instrumentation shares the
    # opentelemetry-instrumentation core, which azure-monitor-opentelemetry
    # pins to ~=0.61b0; hence the 0.61b0 pin and the dependabot.yml ignore
    # that keeps these from being bumped independently of azure-monitor.
    "azure-monitor-opentelemetry==1.8.9",
    "opentelemetry-instrumentation-sqlalchemy==0.61b0",
    "opentelemetry-instrumentation-redis==0.61b0",
    "structlog==26.1.0",
    "azure-storage-blob>=12.22,<13",
]

[project.scripts]
load-events = "ticketing_api.commands.load_events:main"
upload-events = "ticketing_api.commands.upload_events:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",                    # used by FastAPI's TestClient
    "ruff==0.15.21",
    "mypy==2.2.0",
    "types-redis==4.6.0.20241004",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketing_api"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ASYNC", # flake8-async
]
ignore = [
    "S101",  # use of `assert` — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]   # security checks too noisy in tests

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Coverage is informational only — no --cov-fail-under gate yet. The
    # term-missing report prints which source lines no test exercised.
    "--cov=ticketing_api",
    "--cov-report=term-missing",
]
markers = [
    "integration: integration tests requiring docker-compose stack",
]
