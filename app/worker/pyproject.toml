[project]
name = "ticketing-worker"
version = "0.1.0"
description = "Ticketing system — worker service (Service Bus consumer)"
requires-python = ">=3.13,<3.14"

dependencies = [
    # Settings and validation
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",

    # Database — same stack as the API
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",

    # Azure SDKs
    "azure-identity==1.25.3",
    "azure-servicebus==7.14.3",

    # Observability
    "azure-monitor-opentelemetry==1.8.8",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "structlog==24.4.0",

    # Tiny HTTP server for K8s health probes
    "aiohttp==3.14.1",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.17",
    "mypy==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketing_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
disallow_any_explicit = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Coverage is informational only — no --cov-fail-under gate yet. The
    # term-missing report prints which source lines no test exercised.
    "--cov=ticketing_worker",
    "--cov-report=term-missing",
]
